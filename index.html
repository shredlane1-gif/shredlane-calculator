<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shredlane Macro & Calorie Calculator</title>
  <style>
    :root {
      --primary: #1a1a1a;
      --accent: #e63946;
      --bg: #f8f9fa;
      --card: #ffffff;
      --text: #333;
      --muted: #6c757d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 20px;
      min-height: 100vh;
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 8px;
      color: var(--primary);
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 28px;
    }

    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 28px 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 6px;
      color: var(--primary);
    }

    input[type="number"],
    select {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #e0e0e0;
      border-radius: 10px;
      font-size: 1rem;
      margin-bottom: 18px;
      background: #fff;
      transition: border-color 0.2s;
    }

    input[type="number"]:focus,
    select:focus {
      outline: none;
      border-color: var(--accent);
    }

    .radio-group {
      display: flex;
      gap: 12px;
      margin-bottom: 18px;
    }

    .radio-option {
      flex: 1;
      position: relative;
    }

    .radio-option input {
      position: absolute;
      opacity: 0;
      cursor: pointer;
    }

    .radio-option label {
      display: block;
      padding: 12px 10px;
      background: #f1f3f5;
      border-radius: 10px;
      text-align: center;
      font-weight: 500;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
      border: 2px solid transparent;
    }

    .radio-option input:checked + label {
      background: #fff0f1;
      border-color: var(--accent);
      color: var(--accent);
    }

    button {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:hover { background: #d62839; }
    button:active { transform: scale(0.98); }

    #result {
      display: none;
      animation: fadeIn 0.35s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .result-box {
      background: linear-gradient(135deg, #1a1a1a, #2d2d2d);
      color: white;
      border-radius: 14px;
      padding: 22px;
      text-align: center;
      margin-bottom: 18px;
    }

    .result-box .calories {
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: -1px;
    }

    .result-box .protein {
      font-size: 1.25rem;
      margin-top: 6px;
      opacity: 0.9;
    }

    .result-box .tier {
      font-size: 0.85rem;
      margin-top: 10px;
      opacity: 0.7;
    }

    .copy-section {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 16px;
      font-size: 0.9rem;
      line-height: 1.55;
      white-space: pre-wrap;
      border: 1px solid #e9ecef;
    }

    .copy-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .copy-header span {
      font-weight: 600;
      font-size: 0.9rem;
    }

    .copy-btn {
      background: #e9ecef;
      color: #333;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      width: auto;
    }

    .copy-btn:hover { background: #dee2e6; }

    .note {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 14px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Shredlane Calculator</h1>
    <p class="subtitle">Macro & Calorie Targets • Foundations Method</p>

    <div class="card">
      <label for="weight">Current Body Weight (kg)</label>
      <input type="number" id="weight" min="40" max="150" step="0.1" placeholder="e.g. 72.5" />

      <label>Activity Level</label>
      <div class="radio-group">
        <div class="radio-option">
          <input type="radio" id="low" name="activity" value="low" checked />
          <label for="low">Low (&lt;8k steps)</label>
        </div>
        <div class="radio-option">
          <input type="radio" id="active" name="activity" value="active" />
          <label for="active">Active (8k+ steps)</label>
        </div>
      </div>

      <label>Primary Goal</label>
      <div class="radio-group">
        <div class="radio-option">
          <input type="radio" id="fatloss" name="goal" value="fatloss" checked />
          <label for="fatloss">Fat Loss</label>
        </div>
        <div class="radio-option">
          <input type="radio" id="muscle" name="goal" value="muscle" />
          <label for="muscle">Muscle / Lean Bulk</label>
        </div>
      </div>

      <button onclick="calculate()">Calculate My Targets</button>
    </div>

    <div id="result">
      <div class="result-box">
        <div class="calories" id="calories">—</div>
        <div class="protein" id="protein">—</div>
        <div class="tier" id="tierLabel"></div>
      </div>

      <div class="copy-header">
        <span>Ready-to-send DM / Email</span>
        <button class="copy-btn" onclick="copyMessage()">Copy</button>
      </div>
      <div class="copy-section" id="message"></div>

      <p class="note">
        These targets already include a moderate deficit for fat loss.<br>
        Protein stays in the practical 1.3–1.6 g/kg range.
      </p>
    </div>
  </div>

  <script>
    function getBaseTier(weight, activity) {
      // Returns { calories, proteinMin, proteinMax, label }
      if (weight < 60) {
        if (activity === "low") {
          return { calories: 1200, proteinMin: 80, proteinMax: 90, label: "Tier 1" };
        } else {
          return { calories: 1450, proteinMin: 90, proteinMax: 100, label: "Tier 2" };
        }
      } else if (weight <= 75) {
        if (activity === "low") {
          return { calories: 1450, proteinMin: 90, proteinMax: 100, label: "Tier 2" };
        } else {
          return { calories: 1750, proteinMin: 100, proteinMax: 110, label: "Tier 3" };
        }
      } else {
        // Over 75 kg
        if (activity === "low") {
          return { calories: 1750, proteinMin: 100, proteinMax: 110, label: "Tier 3" };
        } else {
          return { calories: 1950, proteinMin: 110, proteinMax: 120, label: "Tier 3 + Extra" };
        }
      }
    }

    function calculate() {
      const weight = parseFloat(document.getElementById("weight").value);
      const activity = document.querySelector('input[name="activity"]:checked').value;
      const goal = document.querySelector('input[name="goal"]:checked').value;

      if (!weight || weight < 40 || weight > 150) {
        alert("Please enter a realistic body weight between 40–150 kg.");
        return;
      }

      let tier = getBaseTier(weight, activity);

      // Goal adjustment
      if (goal === "muscle") {
        // Move up one tier or add 200–300 kcal
        if (tier.label === "Tier 1") {
          tier = { calories: 1450, proteinMin: 90, proteinMax: 100, label: "Tier 2 (Muscle)" };
        } else if (tier.label === "Tier 2") {
          tier = { calories: 1750, proteinMin: 100, proteinMax: 110, label: "Tier 3 (Muscle)" };
        } else if (tier.label === "Tier 3") {
          tier = { calories: 1950, proteinMin: 110, proteinMax: 120, label: "Tier 3 + Extra (Muscle)" };
        } else {
          // Already Tier 3 + Extra → just add ~250 kcal
          tier.calories = 2200;
          tier.proteinMin = 120;
          tier.proteinMax = 130;
          tier.label = "Tier 3 + Extra + Surplus";
        }
      }

      // Display results
      document.getElementById("calories").textContent = tier.calories.toLocaleString() + " kcal";
      document.getElementById("protein").textContent = `${tier.proteinMin}–${tier.proteinMax} g protein`;
      document.getElementById("tierLabel").textContent = tier.label;

      // Generate message
      const message = `Hey [First Name],

Here are your starting targets based on your weight and activity level:

• Daily Calories: ${tier.calories} kcal
• Protein Target: ${tier.proteinMin}–${tier.proteinMax} g

These numbers are the same framework I use with my coaching clients.

Knowing the numbers is only the first step. The real results come from consistent execution, accurate weighing, and adjusting based on real data — not just following a number forever.

Want me to build the full structure around your lifestyle and schedule?

Reply “READY” or [Click here to book a quick strategy call].`;

      document.getElementById("message").textContent = message;
      document.getElementById("result").style.display = "block";
    }

    function copyMessage() {
      const text = document.getElementById("message").textContent;
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.querySelector(".copy-btn");
        btn.textContent = "Copied!";
        setTimeout(() => btn.textContent = "Copy", 1800);
      });
    }

    // Allow Enter key to calculate
    document.getElementById("weight").addEventListener("keydown", function(e) {
      if (e.key === "Enter") calculate();
    });
  </script>
</body>
</html>
