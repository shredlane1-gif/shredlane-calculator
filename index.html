<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shredlane Macro & Calorie Calculator</title>
  <style>
    :root {
      --black: #0a0a0a;
      --yellow: #FFD600;
      --card: #1a1a1a;
      --text: #ffffff;
      --muted: #aaaaaa;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--black);
      color: var(--text);
      line-height: 1.5;
      padding: 20px;
      min-height: 100vh;
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
    }

    h1 {
      font-size: 1.7rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 6px;
      color: var(--yellow);
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 28px;
    }

    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 28px 24px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
      margin-bottom: 20px;
      border: 1px solid #222;
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 6px;
      color: var(--yellow);
    }

    input[type="text"],
    input[type="number"] {
      width: 100%;
      padding: 13px 14px;
      border: 1.5px solid #333;
      border-radius: 10px;
      font-size: 1rem;
      margin-bottom: 18px;
      background: #111;
      color: white;
    }

    input:focus {
      outline: none;
      border-color: var(--yellow);
    }

    .radio-group {
      display: flex;
      gap: 12px;
      margin-bottom: 18px;
    }

    .radio-option {
      flex: 1;
      position: relative;
    }

    .radio-option input {
      position: absolute;
      opacity: 0;
      cursor: pointer;
    }

    .radio-option label {
      display: block;
      padding: 12px 10px;
      background: #111;
      border-radius: 10px;
      text-align: center;
      font-weight: 500;
      font-size: 0.9rem;
      cursor: pointer;
      border: 2px solid #333;
      color: #ccc;
    }

    .radio-option input:checked + label {
      background: rgba(255, 214, 0, 0.12);
      border-color: var(--yellow);
      color: var(--yellow);
    }

    button {
      width: 100%;
      padding: 15px;
      background: var(--yellow);
      color: #000;
      border: none;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #ffe033;
    }

    #result {
      display: none;
      animation: fadeIn 0.35s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .result-box {
      background: linear-gradient(135deg, #111, #1c1c1c);
      border-radius: 14px;
      padding: 24px;
      text-align: center;
      margin-bottom: 18px;
      border: 1px solid #333;
    }

    .result-box .calories {
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--yellow);
    }

    .result-box .protein {
      font-size: 1.3rem;
      margin-top: 6px;
      color: #eee;
    }

    .result-box .tier {
      font-size: 0.85rem;
      margin-top: 10px;
      color: var(--muted);
    }

    .copy-section {
      background: #111;
      border-radius: 12px;
      padding: 16px;
      font-size: 0.9rem;
      line-height: 1.55;
      white-space: pre-wrap;
      border: 1px solid #333;
      color: #ddd;
    }

    .copy-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .copy-header span {
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--yellow);
    }

    .copy-btn {
      background: #333;
      color: white;
      border: none;
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      width: auto;
      font-weight: 600;
    }

    .note {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 16px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Shredlane Calculator</h1>
    <p class="subtitle">Macro & Calorie Targets • Foundations Method</p>

    <div class="card">
      <label for="name">Your First Name</label>
      <input type="text" id="name" placeholder="e.g. Sarah" />

      <label for="weight">Current Body Weight (kg)</label>
      <input type="number" id="weight" min="40" max="150" step="0.1" placeholder="e.g. 72.5" />

      <label>Activity Level</label>
      <div class="radio-group">
        <div class="radio-option">
          <input type="radio" id="low" name="activity" value="low" checked />
          <label for="low">Low (&lt;8k steps)</label>
        </div>
        <div class="radio-option">
          <input type="radio" id="active" name="activity" value="active" />
          <label for="active">Active (8k+ steps)</label>
        </div>
      </div>

      <label>Primary Goal</label>
      <div class="radio-group">
        <div class="radio-option">
          <input type="radio" id="fatloss" name="goal" value="fatloss" checked />
          <label for="fatloss">Fat Loss</label>
        </div>
        <div class="radio-option">
          <input type="radio" id="muscle" name="goal" value="muscle" />
          <label for="muscle">Muscle / Lean Bulk</label>
        </div>
      </div>

      <button onclick="calculate()">Calculate My Targets</button>
    </div>

    <div id="result">
      <div class="result-box">
        <div class="calories" id="calories">—</div>
        <div class="protein" id="protein">—</div>
        <div class="tier" id="tierLabel"></div>
      </div>

      <div class="copy-header">
        <span>Ready-to-send Message</span>
        <button class="copy-btn" onclick="copyMessage()">Copy</button>
      </div>
      <div class="copy-section" id="message"></div>

      <p class="note">
        These targets already include a moderate deficit for fat loss.<br>
        Protein stays in the practical 1.3–1.6 g/kg range.
      </p>
    </div>
  </div>

  <script>
    function getBaseTier(weight, activity) {
      if (weight < 60) {
        return activity === "low"
          ? { calories: 1200, proteinMin: 80, proteinMax: 90, label: "Tier 1" }
          : { calories: 1450, proteinMin: 90, proteinMax: 100, label: "Tier 2" };
      } else if (weight <= 75) {
        return activity === "low"
          ? { calories: 1450, proteinMin: 90, proteinMax: 100, label: "Tier 2" }
          : { calories: 1750, proteinMin: 100, proteinMax: 110, label: "Tier 3" };
      } else {
        return activity === "low"
          ? { calories: 1750, proteinMin: 100, proteinMax: 110, label: "Tier 3" }
          : { calories: 1950, proteinMin: 110, proteinMax: 120, label: "Tier 3 + Extra" };
      }
    }

    function calculate() {
      const name = document.getElementById("name").value.trim() || "there";
      const weight = parseFloat(document.getElementById("weight").value);
      const activity = document.querySelector('input[name="activity"]:checked').value;
      const goal = document.querySelector('input[name="goal"]:checked').value;

      if (!weight || weight < 40 || weight > 150) {
        alert("Please enter a realistic body weight between 40–150 kg.");
        return;
      }

      let tier = getBaseTier(weight, activity);

      // Muscle goal adjustment
      if (goal === "muscle") {
        if (tier.label === "Tier 1") {
          tier = { calories: 1450, proteinMin: 90, proteinMax: 100, label: "Tier 2 (Muscle)" };
        } else if (tier.label === "Tier 2") {
          tier = { calories: 1750, proteinMin: 100, proteinMax: 110, label: "Tier 3 (Muscle)" };
        } else if (tier.label === "Tier 3") {
          tier = { calories: 1950, proteinMin: 110, proteinMax: 120, label: "Tier 3 + Extra (Muscle)" };
        } else {
          tier.calories = 2200;
          tier.proteinMin = 120;
          tier.proteinMax = 130;
          tier.label = "Tier 3 + Extra + Surplus";
        }
      }

      document.getElementById("calories").textContent = tier.calories.toLocaleString() + " kcal";
      document.getElementById("protein").textContent = `${tier.proteinMin}–${tier.proteinMax} g protein`;
      document.getElementById("tierLabel").textContent = tier.label;

      const message = `Hey ${name},

Here are your starting targets:

• Calories: ${tier.calories} kcal
• Protein: ${tier.proteinMin}–${tier.proteinMax} g

These are the same numbers I use with my coaching clients.

Knowing the numbers is only step one. Real results come from consistent execution and adjusting based on real data.

If you’d like me to help you build the full structure around your lifestyle, just reply READY on WhatsApp: +254 705 671 119

Looking forward to hearing from you.`;

      document.getElementById("message").textContent = message;
      document.getElementById("result").style.display = "block";
    }

    function copyMessage() {
      const text = document.getElementById("message").textContent;
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.querySelector(".copy-btn");
        btn.textContent = "Copied!";
        setTimeout(() => btn.textContent = "Copy", 1800);
      });
    }

    document.getElementById("weight").addEventListener("keydown", e => {
      if (e.key === "Enter") calculate();
    });
    document.getElementById("name").addEventListener("keydown", e => {
      if (e.key === "Enter") calculate();
    });
  </script>
</body>
</html>
